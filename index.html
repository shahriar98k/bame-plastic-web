<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><title>বামে প্লাস্টিক</title>

<style>
:root{--st:min(env(safe-area-inset-top,0px),44px);--sb:min(env(safe-area-inset-bottom,0px),30px)}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe0ee;font-family:'Hind Siliguri',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
canvas#g{position:fixed;inset:0;width:100%;height:100%;display:block;filter:contrast(1.1) saturate(1.22)}

#gs{font-size:40px;font-weight:700;line-height:1}#gu{font-size:11px;opacity:.8}#gr{position:absolute;left:10px;top:6px;font-size:22px;font-weight:700;color:#f2b705}
#gb{height:8px;background:#fff3;border-radius:4px;margin-top:4px;overflow:hidden}#gf{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fcf8e,#f2b705,#e5484d)}

.dp{width:66px;height:66px}

#bV{right:74px;bottom:calc(var(--sb) + 10px);background:rgba(190,60,80,.55)}

#ob{left:64px;top:calc(var(--st) + 88px);font-size:13px;max-width:60vw;white-space:nowrap}
#bE{left:8px;top:calc(var(--st) + 84px);width:48px;height:42px;font-size:18px}
#sc{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.82);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#sc .paper{max-width:560px;margin:calc(var(--st) + 10px) auto 20px;background:#f4ecd8;color:#1d1a14;border-radius:6px;padding:14px 16px 18px;box-shadow:0 8px 30px #000a;font-weight:500}

#sc .sub{font-size:12px;opacity:.7;margin-bottom:8px}
#sc .rk{display:inline-block;background:#b3202a;color:#fff;font-weight:700;padding:3px 10px;margin:6px 0;font-size:15px}

#st{background:linear-gradient(180deg,rgba(4,8,16,.62) 0%,rgba(4,8,16,0) 26%,rgba(4,8,16,0) 46%,rgba(4,8,16,.9) 78%);justify-content:space-between;align-items:stretch;padding:calc(var(--st) + 14px) 14px calc(var(--sb) + 12px);gap:0}
#st .top{text-align:center}#st .logo{font-size:46px;font-weight:700;color:#ffd60a;text-shadow:0 3px 0 #b3202a,0 6px 16px #000a;line-height:1.1}#st .tag{font-size:15px;opacity:.9;text-shadow:0 2px 8px #000}
#st .mid{display:flex;justify-content:center}#banter{background:rgba(255,255,255,.96);color:#1d1a14;border-radius:18px;padding:10px 16px;max-width:88vw;font-weight:700;font-size:16px;text-align:center;position:relative;transition:opacity .3s;margin-top:34vh;box-shadow:0 6px 20px #0008}
#banter::after{content:'';position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:rgba(255,255,255,.96);border-bottom:0}
#st .bot{display:flex;flex-direction:column;align-items:center;gap:10px}#st .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}#st .chips span{background:rgba(255,255,255,.14);border:1px solid #fff3;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
#st .keys{font-size:11.5px;opacity:.75;text-align:center}#st .cr{font-size:10.5px;opacity:.6;text-align:center}#st .cr a{color:#9cd2ff}
.pre .b,.pre #mm,.pre #tr,.pre #gg,.pre #rn,.pre #ln,.pre #bE,.pre #ob,.pre #nt{display:none!important}
#vs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}#vs button{font:inherit;font-weight:700;font-size:14px;padding:7px 12px;border-radius:999px;border:2px solid #fff4;background:rgba(255,255,255,.1);color:#fff}#vs button.on{background:#ffd60a;color:#111;border-color:#ffd60a}
</style><style>
/* start screen: scrolls instead of getting cut off, and shrinks on short (landscape) phone screens */
#st{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-sizing:border-box}
#banter{margin-top:min(34vh,120px)}
#hi{background:rgba(255,255,255,.14);border:1px solid #fff3;border-radius:999px;padding:6px 8px 6px 14px;font-size:16px;font-weight:500;display:flex;align-items:center;gap:6px}
#hi button{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:999px;padding:5px 10px;background:#f2b705;color:#111}
@media (max-height:520px){
#st{padding:calc(var(--st) + 4px) 12px calc(var(--sb) + 8px)}
#st .logo{font-size:30px}#st .tag{font-size:12px}
#banter{margin-top:6px;font-size:13px;padding:6px 12px}
#st .bot{gap:6px}#st .chips span{font-size:11px;padding:2px 9px}#st .keys,#st .cr{display:none}
#vs button{padding:4px 9px;font-size:12px}
#un{padding:8px 12px;font-size:17px}#go{padding:8px 28px;font-size:18px}}
#upd{position:fixed;left:50%;bottom:calc(var(--sb) + 8px);transform:translateX(-50%);z-index:100000;background:#f2b705;color:#111;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;display:none;gap:8px;align-items:center;box-shadow:0 4px 16px #0008}
#upd button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:5px 12px;background:#111;color:#f2b705}
